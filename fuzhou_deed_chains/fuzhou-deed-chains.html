<style>
/* Layout: a deed-archive ledger — sticky filter bar, then one section per property, each a vertical timeline of transfers with the year in a left gutter. */
:root{
  --bg:#f2f3ef; --surface:#fbfbf8; --ink:#1f2a2e; --muted:#5d6a6c; --line:#d6d9d2;

  --f-display:"Noto Serif TC","Songti TC","SimSun",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-num:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1d; --surface:#1e2528; --ink:#e4e7e2; --muted:#9aa6a6; --line:#33403f;
  --seal:#e0685c; --seal-soft:#3d2422; --ink-blue:#9cc2d3;
  --hi:#8fd1a9; --hi-bg:#1f3a2b; --mid:#e2bf6f; --mid-bg:#3a3020; --lo:#d3b2d3; --lo-bg:#352a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b1d; --surface:#1e2528; --ink:#e4e7e2; --muted:#9aa6a6; --line:#33403f;
  --seal:#e0685c; --seal-soft:#3d2422; --ink-blue:#9cc2d3;
  --hi:#8fd1a9; --hi-bg:#1f3a2b; --mid:#e2bf6f; --mid-bg:#3a3020; --lo:#d3b2d3; --lo-bg:#352a35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:40px 64px}
header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:20px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--muted);margin:10px 0 0;max-width:62ch}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:18px 0 0;font-size:13px;color:var(--muted)}
.stats b{font-family:var(--f-num);color:var(--ink);font-size:18px;margin-right:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
#q{flex:1 1 200px;min-width:0;font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.chain{margin-top:44px}
.chain-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline}
.letter{font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--seal);line-height:1;grid-row:span 2}
.chain h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;text-wrap:balance}
.span{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.flow{margin:14px 0 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--ink-blue)}
.flow span.arrow{color:var(--seal);margin:0 6px}
.note{margin:10px 0 0;font-size:14px;color:var(--muted);max-width:68ch}
ol.tl{list-style:none;margin:20px 0 0;padding:0}
ol.tl li{display:grid;grid-template-columns:92px 1fr;gap:16px;position:relative}
.yr{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;padding-top:14px;color:var(--ink)}
.yr small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);line-height:1.4}
.ev{border-left:2px solid var(--line);padding:12px 0 18px 22px;position:relative;min-width:0}
.ev::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--seal)}
.ev.inferred::before{border-style:dashed;border-color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.type{font-weight:700}
.pill{font-size:11px;letter-spacing:.06em;border-radius:4px;padding:1px 8px;white-space:nowrap}
.p-hi{background:var(--hi-bg);color:var(--hi)}.p-mid{background:var(--mid-bg);color:var(--mid)}.p-lo{background:var(--lo-bg);color:var(--lo)}
.parties{margin:4px 0 0;font-size:16px}
.parties .arrow{color:var(--seal);margin:0 8px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:8px 0 0;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.files{font-family:var(--f-num);font-size:12px}
.warn{margin-top:8px;font-size:13px;background:var(--seal-soft);border-radius:4px;padding:6px 10px;color:var(--ink)}
.warn b{color:var(--seal)}
.empty{margin-top:40px;color:var(--muted)}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--muted);max-width:72ch}
@media (max-width:600px){
  header{grid-template-columns:1fr}.seal{display:none}
  ol.tl li{grid-template-columns:1fr;gap:0}
  .yr{text-align:left;padding-top:8px}.yr small{display:inline;margin-left:8px}
  dl{grid-template-columns:1fr}dt{margin-top:4px}
}
@media (prefers-reduced-motion:no-preference){.chain{animation:in .4s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

  <header>
    <div>
      <h1>福州契约产权链</h1>

</div>

        return `<li><div class="yr">${empty(d.ad)?"年代不详":esc(d.ad)}<small>${esc(d.era)}</small></div>
        <div class="ev${inferred?" inferred":""}">
          <div class="top"><span class="type">${esc(d.type)}</span><span class="pill p-${confKey(d.conf)}">把握：${esc(d.conf)}</span></div>
          <div class="parties">${esc(d.from)}<span class="arrow">→</span>${esc(d.to)}</div>
          <dl>
            ${empty(d.obj)?"":`<dt>标的</dt><dd>${esc(d.obj)}</dd>`}
            ${empty(d.loc)?"":`<dt>坐落</dt><dd>${esc(d.loc)}</dd>`}
            ${empty(d.price)?"":`<dt>价格</dt><dd>${esc(d.price)}</dd>`}
            ${empty(d.prev)?"":`<dt>附缴上手契</dt><dd>${esc(d.prev)}</dd>`}
            <dt>文件编号</dt><dd class="files">${esc(d.files)}</dd>
          </dl>
          ${empty(d.note)?"":`<div class="warn">${warn?"<b>待核</b>　":""}${esc(d.note)}</div>`}
        </div></li>`;}).join("")}</ol></section>`;
  }).join("");
  document.getElementById("empty").hidden = shown>0;
}
document.getElementById("q").addEventListener("input", e=>{ q=e.target.value.trim(); render(); });
render();
</script>
